<script>
  (() => {
    const replaceCredit = (root) => {
      if (root.nodeType === Node.TEXT_NODE) {
        if (!root.parentElement?.closest("script, style") &&
            (/ROKY/i.test(root.nodeValue) || root.nodeValue.includes("রকি এর পক্ষ থেকে শুধু তোমার জন্য ঈদ মোবারক"))) {
          root.nodeValue = root.nodeValue
            .replace(/RAKIB HASAN ROKY/g, "MD SOUROV HASAN")
            .replace(/ROKY/gi, "SOUROV")
            .replace(/রকি এর পক্ষ থেকে শুধু\s*তোমার জন্য ঈদ মোবারক/g, "সৌরভ এর পক্ষ থেকে শুধু তোমার জন্য ঈদ মোবারক");
        }
        return;
      }

      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      while (walker.nextNode()) {
        const textNode = walker.currentNode;
        if (!textNode.parentElement?.closest("script, style") &&
            (/ROKY/i.test(textNode.nodeValue) || textNode.nodeValue.includes("রকি এর পক্ষ থেকে শুধু তোমার জন্য ঈদ মোবারক"))) {
          textNode.nodeValue = textNode.nodeValue
            .replace(/RAKIB HASAN ROKY/g, "MD SOUROV HASAN")
            .replace(/ROKY/gi, "SOUROV")
            .replace(/রকি এর পক্ষ থেকে শুধু\s*তোমার জন্য ঈদ মোবারক/g, "সৌরভ এর পক্ষ থেকে শুধু তোমার জন্য ঈদ মোবারক");
        }
      }
    };

    const replaceSignature = () => {
      document.querySelectorAll(".dev-signature-text").forEach((element) => {
        if (element.textContent.includes("রকি এর পক্ষ থেকে")) {
          element.textContent = "সৌরভ এর পক্ষ থেকে শুধু তোমার জন্য ঈদ মোবারক";
        }
      });
    };

    replaceCredit(document.documentElement);
    replaceSignature();
    new MutationObserver((records) => {
      for (const record of records) {
        if (record.type === "characterData") {
          replaceCredit(record.target);
        } else {
          for (const node of record.addedNodes) replaceCredit(node);
        }
      }
      replaceSignature();
    }).observe(document.documentElement, { childList: true, characterData: true, subtree: true });
  })();
</script>
